<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dra. Lorena Velásquez Roa — Medicina Integral y Antienvejecimiento</title>
<meta name="description" content="Medicina integral, funcional y antienvejecimiento con la Dra. Lorena Velásquez Roa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FAF6EF;
    --ivory-deep:#F1EAD9;
    --mist:#EDF2F0;
    --teal:#0E4A44;
    --teal-deep:#093430;
    --gold:#A8823D;
    --gold-light:#C9A44E;
    --ink:#26251F;
    --ink-soft:#615E52;
    --line:rgba(38,37,31,0.13);
    --max:1180px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--ivory);color:var(--ink);font-family:'Jost',sans-serif;font-weight:300;line-height:1.65;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;font-weight:500;color:var(--teal-deep);margin:0;}
  p{margin:0;}
  a{color:inherit;text-decoration:none;}
  img,svg{display:block;max-width:100%;}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 32px;}
  ::selection{background:var(--gold-light);color:var(--teal-deep);}
