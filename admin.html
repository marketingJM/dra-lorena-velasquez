<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Reseñas | Dra. Lorena Velásquez Roa</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
  // ⬇️ PEGA AQUÍ el mismo firebaseConfig que pusiste en index.html
  const firebaseConfig = {
    apiKey: "AIzaSyBUY1oFoZGhztpyHJfHclBSqYpGTttJ7vo",
    authDomain: "lvr-medicina-integral.firebaseapp.com",
    projectId: "lvr-medicina-integral",
    storageBucket: "lvr-medicina-integral.firebasestorage.app",
    messagingSenderId: "1028960016143",
    appId: "1:1028960016143:web:833eae210bbd996f51d07a"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
</script>

<style>
  :root{
    --ivory:#FAF6EF; --mist:#F2F1EC; --teal:#0E4A44; --teal-deep:#093430;
    --gold:#A8823D; --ink:#20201C; --ink-soft:#6B6a5F; --line:rgba(32,32,28,0.13);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--ivory); color:var(--ink); font-family:'Jost',sans-serif; font-weight:300;}
  .wrap{max-width:760px; margin:0 auto; padding:40px 24px 80px;}
  h1{font-size:1.5rem; font-weight:600; margin:0 0 6px;}
  .sub{color:var(--ink-soft); font-size:0.9rem; margin-bottom:36px;}

  /* Login */
  #loginBox{max-width:340px; margin:80px auto; text-align:center;}
  #loginBox input{
    width:100%; padding:12px 14px; margin-bottom:12px; border:1px solid var(--line);
    border-radius:10px; font-family:'Jost',sans-serif; font-size:0.95rem;
  }
  #loginBox button{
    width:100%; padding:13px; background:var(--teal); color:var(--ivory); border:none;
    border-radius:10px; font-size:0.95rem; cursor:pointer; font-family:'Jost',sans-serif;
  }
  #loginBox button:hover{background:var(--teal-deep);}
  #loginError{color:#b23; font-size:0.85rem; margin-top:10px; min-height:18px;}
  #logoutBtn{
    background:none; border:1px solid var(--line); border-radius:999px; padding:7px 16px;
    font-size:0.82rem; cursor:pointer; color:var(--ink-soft); float:right;
  }

  section{margin-bottom:44px;}
  h2{font-size:1.1rem; margin-bottom:16px;}
  .card{
    background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px;
    margin-bottom:14px; display:flex; flex-direction:column; gap:8px;
  }
  .card .stars{color:var(--gold);}
  .card .name{font-weight:600;}
  .card .comment{color:var(--ink-soft); font-style:italic; font-size:0.92rem;}
  .card .actions{display:flex; gap:10px; margin-top:6px;}
  .card button{
    border:none; border-radius:8px; padding:8px 16px; font-size:0.85rem; cursor:pointer;
    font-family:'Jost',sans-serif;
  }
  .approve-btn{background:var(--teal); color:var(--ivory);}
  .approve-btn:hover{background:var(--teal-deep);}
  .reject-btn, .delete-btn{background:var(--mist); color:var(--ink);}
  .reject-btn:hover, .delete-btn:hover{background:#e3d9d9;}
  .cal-btn{background:var(--gold); color:#fff; text-decoration:none; display:inline-block;}
  .cal-btn:hover{opacity:0.9;}
  .booking-when{font-weight:600; color:var(--teal-deep);}
  .empty{color:var(--ink-soft); font-size:0.9rem;}
</style>
</head>
<body>

<div id="loginBox">
  <h1 style="text-align:center;">Administración de reseñas</h1>
  <p class="sub" style="text-align:center;">Inicia sesión para aprobar comentarios</p>
  <input type="email" id="loginEmail" placeholder="Correo electrónico">
  <input type="password" id="loginPass" placeholder="Contraseña">
  <button id="loginBtn">Entrar</button>
  <p id="loginError"></p>
</div>

<div class="wrap" id="adminPanel" style="display:none;">
  <button id="logoutBtn">Cerrar sesión</button>
  <h1>Reseñas</h1>
  <p class="sub">Aprueba o rechaza los comentarios enviados desde la página.</p>

  <section>
    <h2>Pendientes de revisión</h2>
    <div id="pendingList"><p class="empty">Cargando...</p></div>
  </section>

  <section>
    <h2>Publicadas actualmente</h2>
    <div id="approvedList"><p class="empty">Cargando...</p></div>
  </section>

  <section>
    <h2>Citas agendadas</h2>
    <div id="bookingsList"><p class="empty">Cargando...</p></div>
  </section>
</div>

<script>
  const loginBox = document.getElementById('loginBox');
  const adminPanel = document.getElementById('adminPanel');
  const loginError = document.getElementById('loginError');

  document.getElementById('loginBtn').addEventListener('click', () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    loginError.textContent = '';
    auth.signInWithEmailAndPassword(email, pass).catch(err => {
      loginError.textContent = 'Correo o contraseña incorrectos.';
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());

  auth.onAuthStateChanged(user => {
    if (user) {
      loginBox.style.display = 'none';
      adminPanel.style.display = 'block';
      loadReviews();
    } else {
      loginBox.style.display = 'block';
      adminPanel.style.display = 'none';
    }
  });

  function starRow(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); }

  function loadReviews() {
    const pendingList = document.getElementById('pendingList');
    const approvedList = document.getElementById('approvedList');

    db.collection('reviews').orderBy('createdAt', 'desc').get().then(snapshot => {
      const pending = [];
      const approved = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        data.id = doc.id;
        if (data.approved) approved.push(data); else pending.push(data);
      });

      pendingList.innerHTML = pending.length
        ? pending.map(r => `
          <div class="card">
            <div class="stars">${starRow(r.stars)}</div>
            <div class="name">${r.name}</div>
            <div class="comment">"${r.comment}"</div>
            <div class="actions">
              <button class="approve-btn" onclick="approveReview('${r.id}')">Aprobar y publicar</button>
              <button class="reject-btn" onclick="deleteReview('${r.id}')">Rechazar</button>
            </div>
          </div>`).join('')
        : '<p class="empty">No hay reseñas pendientes.</p>';

      approvedList.innerHTML = approved.length
        ? approved.map(r => `
          <div class="card">
            <div class="stars">${starRow(r.stars)}</div>
            <div class="name">${r.name}</div>
            <div class="comment">"${r.comment}"</div>
            <div class="actions">
              <button class="delete-btn" onclick="deleteReview('${r.id}')">Eliminar</button>
            </div>
          </div>`).join('')
        : '<p class="empty">Todavía no hay reseñas publicadas.</p>';
    });

    loadBookings();
  }

  function loadBookings() {
    const bookingsList = document.getElementById('bookingsList');
    db.collection('bookings').orderBy('date').orderBy('time').get().then(snapshot => {
      const bookings = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        data.id = doc.id;
        bookings.push(data);
      });

      bookingsList.innerHTML = bookings.length
        ? bookings.map(b => {
            const [y, m, d] = b.date.split('-');
            const startDT = `${y}${m}${d}T${b.time.replace(':', '')}00`;
            const endHour = String(Number(b.time.split(':')[0]) + 1).padStart(2, '0');
            const endDT = `${y}${m}${d}T${endHour}0000`;
            const calText = encodeURIComponent(`Cita: ${b.service} — ${b.name}`);
            const calDetails = encodeURIComponent(`Paciente: ${b.name}\nServicio: ${b.service}\nCorreo: ${b.email}\nTeléfono: ${b.phone}`);
            const calUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${calText}&dates=${startDT}/${endDT}&details=${calDetails}`;
            return `
          <div class="card">
            <div class="booking-when">${b.date} — ${b.time}</div>
            <div class="name">${b.name} (${b.service})</div>
            <div class="comment">${b.email} · ${b.phone}</div>
            <div class="actions">
              <a class="cal-btn" href="${calUrl}" target="_blank" rel="noopener">Agregar a Google Calendar</a>
              <button class="delete-btn" onclick="cancelBooking('${b.id}', '${b.date}', '${b.time}')">Cancelar cita</button>
            </div>
          </div>`;
          }).join('')
        : '<p class="empty">No hay citas agendadas.</p>';
    });
  }

  function cancelBooking(id, date, time) {
    if (!confirm('¿Cancelar esta cita? El horario quedará libre de nuevo.')) return;
    db.collection('bookings').doc(id).delete()
      .then(() => db.collection('slots').doc(`${date}_${time}`).delete())
      .then(loadBookings);
  }

  function approveReview(id) {
    db.collection('reviews').doc(id).update({ approved: true }).then(loadReviews);
  }

  function deleteReview(id) {
    if (confirm('¿Seguro que quieres eliminar esta reseña?')) {
      db.collection('reviews').doc(id).delete().then(loadReviews);
    }
  }
</script>

</body>
</html>
